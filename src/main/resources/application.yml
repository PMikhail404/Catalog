server:
  port: 9090

logging:
  level:
    com.packet: DEBUG
  pattern:
    file: '%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: ./logs/packet.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 100MB

spring:
  application:
    name: Packet

  datasource:
    url: jdbc:postgresql://localhost:5433/cinema_booking
    username: postgres
    password: 1
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          order_inserts: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    contexts: dev
