databaseChangeLog:
  - changeSet:
      id: 006-create-session
      author: Mikhail404
      changes:
        - createTable:
            tableName: movie_session
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_movie_session
              - column:
                  name: hall_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_movie_session_hall
                    references: hall(id)
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_movie_session_movie
                    references: movie(id)
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: movie_session
            indexName: idx_movie_session_hall_start
            columns:
              - column:
                  name: hall_id
              - column:
                  name: start_time
        - createIndex:
            tableName: movie_session
            indexName: idx_movie_session_movie
            columns:
              - column:
                  name: movie_id
        - sql:
            sql: ALTER TABLE movie_session ADD CONSTRAINT ck_movie_session_time CHECK (end_time > start_time)
        - sql:
            sql: >
              ALTER TABLE movie_session ADD CONSTRAINT ex_movie_session_no_overlap
              EXCLUDE USING gist (hall_id WITH =, tstzrange(start_time, end_time) WITH &&)
              WHERE (status = 'SCHEDULED')
      rollback:
        - dropTable:
            tableName: movie_session
