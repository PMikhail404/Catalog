databaseChangeLog:
  - changeSet:
      id: 004-create-movie
      author: Mikhail404
      changes:
        - createTable:
            tableName: movie
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_movie
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE movie ADD CONSTRAINT ck_movie_duration CHECK (duration_minutes > 0)
      rollback:
        - dropTable:
            tableName: movie
